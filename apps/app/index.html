<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#030806">
  <meta name="description" content="Rocket Alert — unofficial Israel rocket/UAV alert timer for the rabbit r1.">
  <title>Rocket Alert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app" class="receiver" aria-label="Rocket Alert timer">
    <header class="topbar">
      <div class="brand">
        <button id="test-alert" class="brand-mark" type="button" aria-label="Test alert sound and screen pulse" title="Test alert">
          <svg class="rocket-icon" viewBox="0 0 24 24" fill="none" role="img" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path d="M15.5904 14.3696C15.6948 14.8128 15.75 15.275 15.75 15.75C15.75 19.0637 13.0637 21.75 9.75 21.75V16.9503M15.5904 14.3696C19.3244 11.6411 21.75 7.22874 21.75 2.25C16.7715 2.25021 12.3595 4.67586 9.63122 8.40975M15.5904 14.3696C13.8819 15.6181 11.8994 16.514 9.75 16.9503M9.63122 8.40975C9.18777 8.30528 8.72534 8.25 8.25 8.25C4.93629 8.25 2.25 10.9363 2.25 14.25H7.05072M9.63122 8.40975C8.38285 10.1183 7.48701 12.1007 7.05072 14.25M9.75 16.9503C9.64659 16.9713 9.54279 16.9912 9.43862 17.0101C8.53171 16.291 7.70991 15.4692 6.99079 14.5623C7.00969 14.4578 7.02967 14.3537 7.05072 14.25M4.81191 16.6408C3.71213 17.4612 3 18.7724 3 20.25C3 20.4869 3.0183 20.7195 3.05356 20.9464C3.28054 20.9817 3.51313 21 3.75 21C5.22758 21 6.53883 20.2879 7.35925 19.1881M16.5 9C16.5 9.82843 15.8284 10.5 15 10.5C14.1716 10.5 13.5 9.82843 13.5 9C13.5 8.17157 14.1716 7.5 15 7.5C15.8284 7.5 16.5 8.17157 16.5 9Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <h1 class="app-title">ROCKET ALERT</h1>
      </div>
      <div class="live-indicator" aria-live="polite">
        <span id="alert-dot" class="alert-dot live-lamp" aria-hidden="true"></span>
        <span id="status" class="status">Loading…</span>
      </div>
    </header>

    <div class="notice" role="note">
      <span class="notice-pill">UNOFFICIAL</span>
      <span class="notice-text">Follow official alerts.</span>
    </div>

    <section class="last-alert-card" aria-live="polite">
      <div class="last-alert-map-wrap" id="last-alert-map-wrap">
        <img
          class="last-alert-map"
          src="/src/assets/israel-outline.svg"
          width="90"
          height="120"
          alt=""
          aria-hidden="true"
        >
        <span id="alert-pin" class="alert-pin" aria-hidden="true"></span>
      </div>
      <div class="last-alert-copy">
        <div class="last-alert-label">LAST</div>
        <div id="last-location" class="last-alert-value">—</div>
      </div>
    </section>

    <main class="timer-panel" aria-live="polite">
      <div class="panel-label">SINCE ALERT</div>
      <div class="timer-row main-time">
        <div class="unit">
          <span id="days" class="digit">--</span>
          <span class="unit-label">DAYS</span>
        </div>
        <span class="sep" aria-hidden="true">:</span>
        <div class="unit">
          <span id="hours" class="digit">--</span>
          <span class="unit-label">HRS</span>
        </div>
        <span class="sep" aria-hidden="true">:</span>
        <div class="unit">
          <span id="minutes" class="digit">--</span>
          <span class="unit-label">MIN</span>
        </div>
      </div>
      <div class="timer-row sub-time">
        <div class="unit">
          <span id="seconds" class="digit-sm">--</span>
          <span class="unit-label">SEC</span>
        </div>
        <span class="sep-sm" aria-hidden="true">.</span>
        <div class="unit">
          <span id="millis" class="digit-sm">--</span>
          <span class="unit-label">MS</span>
        </div>
      </div>
    </main>

    <footer class="controls">
      <p>SIDE = REFRESH · TAP ROCKET = TEST</p>
    </footer>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
